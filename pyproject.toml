[project]
name = "SpatialTrajoptRacing"
version = "0.1.0"
description = "A brief description of your SpatialTrajoptRacing package"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Alexander Wachter", email = "wachter@acin.tuwien.ac.at" },
    { name = "Alexander Willert", email = "willert@acin.tuwien.ac.at" },
    { name = "Marc-Philip Ecker", email = "ecker@acin.tuwien.ac.at" },
    { name = "Christian Hartl-Nesic", email = "hartl@acin.tuwien.ac.at" }
]
keywords = ["optimization", "gui", "spatial-trajopt-racing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==1.26.4",
    "matplotlib",
    "opencv-python",
    "pyyaml",
    "scipy",
    "scikit-image",
    "splinepy",
    "cma",
    "pillow",
    "tqdm"
]


[project.scripts]
raceline-gui = "spatial_trajopt_racing.gui:main"

[tool.setuptools]
packages = ["spatial_trajopt_racing"]